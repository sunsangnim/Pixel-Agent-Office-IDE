name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # node-pty is a native module and the app targets Windows-specific ConPTY
    # behavior (see src/main/resolveCommand.ts), so verify on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:movement
      - run: npm run test:editor-layering
      - run: npm run test:integration
      - run: npm run test:recovery
      - run: npm run test:workspace
      - run: npm run build
      - run: npm run test:recovery-ui
      - run: npm run test:meeting-ui
      - run: npm run test:office-ui
      - run: npm run test:workspace-ui
