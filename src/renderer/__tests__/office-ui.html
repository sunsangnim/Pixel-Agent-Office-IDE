<!doctype html><html lang="ko"><head><meta charset="utf-8"></head><body><div id="root"></div><script type="module">
import React from 'react'
import {createRoot} from 'react-dom/client'
import App from '../src/App'
import {OfficeScene} from '../src/game/OfficeScene'
import {BUILT_IN_AGENT_PROFILES} from '@shared/agentProfiles'
import '../src/styles/global.css'
localStorage.clear()
const oldCreate=OfficeScene.prototype.create
OfficeScene.prototype.create=function(){oldCreate.call(this);window.scene=this}
const noop=()=>()=>{}
const profiles=BUILT_IN_AGENT_PROFILES.filter(p=>p.rank==='teamLead')
const templates=[{id:'claude-code',name:'Claude',color:'#b28d84'},{id:'codex-cli',name:'Codex',color:'#568f88'},{id:'antigravity-cli',name:'Antigravity',color:'#8278b7'}]
const instances=profiles.map((p,i)=>({...p,instanceId:`instance-${i}`,ptyId:`pty-${i}`}))
const listeners={data:new Set(),state:new Set(),exit:new Set()}
const listen=type=>fn=>{listeners[type].add(fn);return ()=>listeners[type].delete(fn)}
window.emit=(type,event)=>listeners[type].forEach(fn=>fn(event))
window.calls=[]
window.api={
 workspace:{getWorkFolder:async()=>'/test-workspace',chooseWorkFolder:async()=>null},
 templates:{list:async()=>templates,onChanged:noop},profiles:{list:async()=>profiles},
 instances:{list:async()=>instances,create:async()=>{window.calls.push('create');return instances}},
 teamCapacity:{report:async()=>{},onChanged:noop},
 pty:{onData:listen('data'),onState:listen('state'),onExit:listen('exit'),getBuffer:async()=>'',
   getStates:async()=>instances.map(i=>({ptyId:i.ptyId,state:'waiting',reason:'작업 폴더 신뢰 승인 대기'})),
   sendPrompt:(id,text)=>window.calls.push(['prompt',id,text]),cancelPrompt:id=>window.calls.push(['cancel',id]),resize:()=>{},write:()=>{}},
 system:{openSettings:()=>{}},tasks:{prepare:async()=>{window.calls.push('prepare');return {taskId:'test-task',rootPath:'/test-docs',specPath:'/test-docs/spec',phasesPath:'/test-docs/phases',readmePath:'/test-docs/readme'}},readSpec:async()=>{window.calls.push('readSpec');return '# 테스트 기획'}}
}
if(location.search.includes('recover'))localStorage.setItem('pixel-office:chat-history-v1',JSON.stringify([
 {id:'legacy-user',kind:'user',authorName:'대표',authorColor:'',authorSeed:'me',text:'@Claude 대표실로 오게나'},
 {id:'legacy-plan',kind:'system',authorName:'',authorColor:'',authorSeed:'',text:'Claude에게 기획 작성 요청 (구현 전 승인 필요)'}]))
window.advance=(seconds)=>{for(let i=0;i<seconds*60;i++)window.scene.update(0,1000/60)}
createRoot(document.getElementById('root')).render(React.createElement(App))
</script></body></html>
