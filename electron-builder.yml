appId: com.sunsangnim.pixel-agent-office-ide
productName: Pixel Agent Office IDE
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# node-pty ships a native .node binding - it must live as a real file on disk
# (asar packs everything into one archive Node's native module loader can't
# dlopen from), so unpack it and anything else with a native addon.
asarUnpack:
  - '**/*.node'
publish:
  provider: github
  owner: sunsangnim
  repo: Pixel-Agent-Office-IDE
  # matches the published (non-draft) release the workflow pre-creates -
  # electron-builder skips publishing entirely if this doesn't match the
  # existing release's type.
  releaseType: release
win:
  target: nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
# oneClick is required for electron-updater's silent install-on-quit to
# actually be silent - with oneClick:false (the "assisted" installer),
# electron-updater's own /S-silent relaunch still surfaces the full wizard
# (user/directory pages), defeating the point of a background auto-update.
# The tradeoff is no directory-picker on first install, which is fine for
# almost everyone.
nsis:
  oneClick: true
linux:
  target: AppImage
  category: Development
mac:
  target: dmg
  category: public.app-category.developer-tools
